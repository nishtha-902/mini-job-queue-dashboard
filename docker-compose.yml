services:
  postgres:
    image: postgres:18-alpine
    container_name: mini-job-queue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_queue_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: